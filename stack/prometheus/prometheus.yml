global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: alexandria-node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: alexandria-containers
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

name: observability

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      TZ: Australia/Sydney
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.ambitiouscake.com
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    ports:
      - "13000:3000"
    volumes:
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/grafana:/var/lib/grafana
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: &local-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  storage-init:
    image: alpine:${ALPINE_VERSION:-3.22}
    container_name: observability-storage-init
    # Compose retains completed one-shot containers in Portainer. Keep this
    # lightweight sentinel healthy after idempotent storage preparation so the
    # stack has an accurate all-green lifecycle state.
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        install -d -m 0750 /data/observability
        install -d -m 0750 -o 472 -g 0 /data/observability/grafana
        install -d -m 0750 -o 65534 -g 65534 /data/observability/prometheus
        install -d -m 0750 -o 65534 -g 65534 /data/observability/alertmanager
        install -d -m 0750 -o 10001 -g 10001 /data/observability/loki
        install -d -m 0750 /data/observability/alloy
        install -d -m 0700 /data/observability/secrets
        if [ ! -s /data/observability/secrets/grafana_admin_password ]; then
          umask 077
          head -c 48 /dev/urandom | base64 > /data/observability/secrets/grafana_admin_password
        fi
        touch /data/observability/secrets/notifiarr_passthrough_key
        chmod 0600 /data/observability/secrets/notifiarr_passthrough_key
        touch /tmp/storage-ready
        exec tail -f /dev/null
    volumes:
      - /volume1/docker:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/storage-ready"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    logging: *local-logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *local-logging

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-latest}
    container_name: alertmanager
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_healthy
      alert-relay:
        condition: service_healthy
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *local-logging

  alert-relay:
    image: python:${PYTHON_VERSION:-3.13-alpine}
    container_name: alert-relay
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_healthy
    command: ["python", "/app/relay.py"]
    environment:
      TZ: Australia/Sydney
      NOTIFIARR_CHANNEL_ID: ${NOTIFIARR_CHANNEL_ID:-1545951260908195940}
      NOTIFIARR_KEY_FILE: /run/secrets/notifiarr_passthrough_key
    volumes:
      - ./alert-relay/relay.py:/app/relay.py:ro
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/secrets/notifiarr_passthrough_key:/run/secrets/notifiarr_passthrough_key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *local-logging

  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: loki
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_healthy
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/loki:/loki
    healthcheck:
      # The official Loki image is distroless: it has neither /bin/sh nor wget.
      # Invoke the shipped binary directly so Docker can validate the process.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *local-logging

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-latest}
    container_name: alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    user: root
    depends_on:
      storage-init:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OBSERVABILITY_DATA_ROOT:-/volume1/docker/observability}/alloy:/var/lib/alloy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *local-logging

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|volume1/@.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *local-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-latest}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Synology Container Manager stores Docker state under the volume's
      # package directory rather than the conventional /var/lib/docker path.
      - ${DOCKER_DATA_ROOT:-/volume1/@docker}:/var/lib/docker:ro
    logging: *local-logging

networks:
  default:
    name: observability

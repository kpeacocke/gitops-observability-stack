---
name: Validate and deploy

"on":
  push:
    branches: [main]
    paths:
      - "stack/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-observability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose -f stack/compose.yml config --quiet

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer GitOps webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl --fail --show-error --silent --request POST "$PORTAINER_WEBHOOK_URL"
